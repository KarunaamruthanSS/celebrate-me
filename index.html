<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CelebrateMe - Personalized Celebration Pages</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #6a0dad 0%, #c71585 50%, #ff1493 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .app-container { display: flex; min-height: 100vh; }
        .sidebar {
            width: 280px;
            background: rgba(40, 10, 60, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 2px 0 20px rgba(0, 0, 0, 0.5);
            padding: 30px 0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            border-right: 1px solid rgba(255, 20, 147, 0.3);
        }
        .logo {
            text-align: center;
            margin-bottom: 40px;
            padding: 0 20px;
        }
        .logo h1 {
            font-size: 24px;
            background: linear-gradient(135deg, #ff6b9d 0%, #feca57 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .tabs {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 0 20px;
        }
        .tab-btn {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
            color: #e0e0e0;
            text-align: left;
        }
        .tab-btn .icon { font-size: 24px; }
        .tab-btn:hover {
            background: rgba(255, 107, 157, 0.1);
            transform: translateX(5px);
            border-color: rgba(255, 107, 157, 0.3);
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #ff6b9d 0%, #c06c84 100%);
            color: white;
            border: 2px solid #ff6b9d;
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.4);
        }
        .content {
            margin-left: 280px;
            flex: 1;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .form-container { width: 100%; max-width: 600px; }
        .celebration-form {
            display: none;
            background: rgba(40, 10, 60, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 20, 147, 0.3);
            animation: fadeIn 0.5s ease;
        }
        .celebration-form.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .celebration-form h2 {
            margin-bottom: 30px;
            color: #fff;
            font-size: 28px;
            text-align: center;
        }
        .form-group { margin-bottom: 25px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #e0e0e0;
            font-weight: 600;
            font-size: 14px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }
        .form-group input::placeholder, .form-group textarea::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #ff6b9d;
            box-shadow: 0 0 0 3px rgba(255, 107, 157, 0.2);
        }
        .form-group textarea { min-height: 120px; resize: vertical; }
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff6b9d 0%, #c06c84 100%);
            color: white;
            border: 3px solid #ff5588;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.4);
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 157, 0.6);
        }
        @media (max-width: 768px) {
            .sidebar { width: 100%; height: auto; position: relative; }
            .content { margin-left: 0; padding: 20px; }
            .app-container { flex-direction: column; }
        }
    </style>
</head>
<body>

        <aside class="sidebar">
            <div class="logo"><h1>🎉 CelebrateMe</h1></div>

                    </div>

                </form>
                <form id="christmas-form" class="celebration-form">
                    <h2>🎄 Christmas Celebration</h2>
                    <div class="form-group">
                        <label>Recipient's Name:</label>
                        <input type="text" name="name" required placeholder="Enter name">
                    </div>
                    <div class="form-group">
                        <label>From:</label>
                        <input type="text" name="from" required placeholder="Your name">
                    </div>

                    </div>

                </form>

                    <div class="form-group">
                        <label>Recipient's Name:</label>
                        <input type="text" name="name" required placeholder="Enter name">
                    </div>
                    <div class="form-group">
                        <label>Year:</label>
                        <input type="number" name="year" required placeholder="2026" value="2026">
                    </div>
                    <div class="form-group">
                        <label>New Year Message:</label>
                        <textarea name="message" required placeholder="Write your New Year wishes..."></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Generate New Year Page 🎊</button>
                </form>
            </div>
        </main>
    </div>
    <script>
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.celebration-form').forEach(f => f.classList.remove('active'));
        document.getElementById(btn.dataset.tab + '-form').classList.add('active');
    });
});

function downloadHTML(content, filename) {
    const blob = new Blob([content], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}
